[workspace]
resolver = "2"
members = [
    "projects/runtime/odin-vm",
    "projects/napi/odin-vm-napi",
]
default-members = ["projects/runtime/odin-vm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/nyar-vm/odin-vm"

[workspace.dependencies]
# 引擎底座。CI 用 git `rev` 解析；本机路径写在 `.cargo/config.toml`。
interpreter-vm-ovm = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
interpreter-gc = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
# `.odin` 字节码磁盘格式与 ABI sidecar 合同。
data-binary-odin = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }

odin-vm = { path = "projects/runtime/odin-vm" }

serde_json = "1.0.154"
napi = { version = "3.14.2", default-features = true, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2"

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
